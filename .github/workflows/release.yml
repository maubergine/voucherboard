name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'maubergine/voucherboard'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voucherboard/package-lock.json

      - name: Install dependencies
        working-directory: voucherboard
        run: npm ci

      - name: Validate manifest.json
        working-directory: voucherboard
        run: npm run validate-manifest

      - name: Run tests
        working-directory: voucherboard
        run: npm test

  release:
    needs: test
    # Belt and braces: only the canonical repo's main branch, pushed or dispatched by the owner,
    # may cut a release and push tags/commits with the repo's token.
    if: >-
      github.repository == 'maubergine/voucherboard' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    # The release commit and tag are pushed as the owner's GitHub App, which is the only
    # non-owner bypass on the main ruleset. Its key lives in this environment, which only
    # main can deploy to, so no other branch or fork can mint the token.
    environment: release
    permissions:
      contents: read
    outputs:
      new_release_published: ${{ steps.semrelease.outputs.released }}
      new_release_version: ${{ steps.semrelease.outputs.version }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voucherboard/package-lock.json

      - name: Install dependencies
        working-directory: voucherboard
        run: npm ci

      - name: Run semantic-release
        id: semrelease
        working-directory: voucherboard
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

      - name: Upload release package artifact
        if: steps.semrelease.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: voucherboard/dist/*.zip
          if-no-files-found: error
          retention-days: 90

  chrome-web-store:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - name: Check Chrome Web Store secrets are configured
        id: secrets
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ]; then
            echo "::notice::Chrome Web Store secrets are not configured (CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN). Skipping Chrome Web Store publish for v${{ needs.release.outputs.new_release_version }}. See docs/RELEASING.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release package artifact
        if: steps.secrets.outputs.have == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: dist

      - name: Publish to the Chrome Web Store
        if: steps.secrets.outputs.have == 'true'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          zip_file=$(find dist -maxdepth 1 -name '*.zip' ! -name '*-unpacked.zip' | head -n1)
          if [ -z "$zip_file" ]; then
            echo "::error::No release zip found in dist/"
            exit 1
          fi
          echo "Uploading $zip_file"

          token_response=$(curl -sS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          access_token=$(printf '%s' "$token_response" | node -e '
            let d = "";
            process.stdin.on("data", c => (d += c));
            process.stdin.on("end", () => {
              const t = JSON.parse(d).access_token;
              if (!t) { console.error("No access_token in OAuth response"); process.exit(1); }
              process.stdout.write(t);
            });
          ')

          upload_response=$(curl -sS -w '\n%{http_code}' -X PUT \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -T "$zip_file")
          upload_status=$(printf '%s' "$upload_response" | tail -n1)
          upload_body=$(printf '%s' "$upload_response" | sed '$d')
          echo "Upload response ($upload_status): $upload_body"
          if [ "$upload_status" != "200" ]; then
            echo "::error::Chrome Web Store upload failed"
            exit 1
          fi

          publish_response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish" \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")
          publish_status=$(printf '%s' "$publish_response" | tail -n1)
          publish_body=$(printf '%s' "$publish_response" | sed '$d')
          echo "Publish response ($publish_status): $publish_body"
          if [ "$publish_status" != "200" ]; then
            echo "::error::Chrome Web Store publish failed"
            exit 1
          fi

      - name: Skipped notice
        if: steps.secrets.outputs.have != 'true'
        run: |
          echo "Chrome Web Store publish skipped: secrets not configured."
