name: Release

# On every push to main: tests, semantic-release, then a check of which stores have something new
# (scripts/store-changes.mjs). Only those are offered for upload, and each waits for the owner's approval of its
# environment. Uploads are drafts: nothing is ever submitted for review. See docs/RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Offer an upload even if nothing changed (still needs approval)"
        required: false
        type: choice
        options: [none, chrome, ios, firefox, safari, all]
        default: none

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'maubergine/voucherboard'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest.json
        run: npm run validate-manifest

      - name: Run tests
        run: npm test

  release:
    needs: test
    if: >-
      github.repository == 'maubergine/voucherboard' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    # One release at a time. Store uploads have their own groups, so an approval left waiting doesn't hold this up.
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    # The release commit and tag are pushed with a GitHub App token.
    environment: release
    permissions:
      contents: read
    outputs:
      new_release_published: ${{ steps.semrelease.outputs.released }}
      new_release_version: ${{ steps.semrelease.outputs.version }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semrelease
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

  # Compares each store's candidate with what it was last sent, and says why in the run summary. Asks for no approval.
  changes:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      chrome: ${{ steps.changes.outputs.chrome }}
      chrome_tag: ${{ steps.changes.outputs.chrome_tag }}
      ios: ${{ steps.changes.outputs.ios }}
      ios_tag: ${{ steps.changes.outputs.ios_tag }}
      firefox: ${{ steps.changes.outputs.firefox }}
      firefox_tag: ${{ steps.changes.outputs.firefox_tag }}
      safari: ${{ steps.changes.outputs.safari }}
      safari_tag: ${{ steps.changes.outputs.safari_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history and tags, including the release commit and tag the release job just pushed.
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the last uploads
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          VB_FORCE: ${{ inputs.force || 'none' }}
        run: node scripts/store-changes.mjs

  # Uploads the release's Chrome store zip to the Chrome Web Store as a draft, after approval of the chrome-web-store
  # environment. Never submits for review.
  chrome:
    needs: changes
    if: needs.changes.outputs.chrome == 'true'
    # One at a time: a later run waits, then checks again before asking for approval.
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      id-token: write
    uses: ./.github/workflows/chrome-release.yml
    with:
      tag: ${{ needs.changes.outputs.chrome_tag }}
      force: ${{ inputs.force || 'none' }}
    secrets: inherit

  # Signs the latest release's app and uploads it to TestFlight, after approval of the app-store environment. Never
  # submits for review. Test builds of unreleased commits are testflight.yml's, run by hand.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # One at a time: a later run waits, then checks again before asking for approval.
    concurrency:
      group: app-store
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ios-release.yml
    with:
      ref: ${{ needs.changes.outputs.ios_tag }}
      force: ${{ inputs.force || 'none' }}
    secrets: inherit

  # Builds, lints and validates the Firefox zip, after approval of the firefox-amo environment. Never creates an AMO
  # version: the owner uploads the zip in the Developer Hub (docs/FIREFOX.md).
  firefox:
    needs: changes
    if: needs.changes.outputs.firefox == 'true'
    concurrency:
      group: firefox-amo
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/firefox-release.yml
    with:
      tag: ${{ needs.changes.outputs.firefox_tag }}
      force: ${{ inputs.force || 'none' }}
    secrets: inherit

  # Signs the Safari app with Developer ID, notarises it and attaches it to the release, after approval of the safari
  # environment. Never goes to the Mac App Store.
  safari:
    needs: changes
    if: needs.changes.outputs.safari == 'true'
    concurrency:
      group: safari
      cancel-in-progress: false
    permissions:
      contents: write
      deployments: read
    uses: ./.github/workflows/safari-release.yml
    with:
      tag: ${{ needs.changes.outputs.safari_tag }}
      force: ${{ inputs.force || 'none' }}
    secrets: inherit
