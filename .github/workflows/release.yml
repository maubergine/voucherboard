name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cws_tag:
        description: "Re-upload this existing release (e.g. v0.2.1) to the Chrome Web Store, skipping semantic-release"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'maubergine/voucherboard'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voucherboard/package-lock.json

      - name: Install dependencies
        working-directory: voucherboard
        run: npm ci

      - name: Validate manifest.json
        working-directory: voucherboard
        run: npm run validate-manifest

      - name: Run tests
        working-directory: voucherboard
        run: npm test

  release:
    needs: test
    if: >-
      github.repository == 'maubergine/voucherboard' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      !inputs.cws_tag
    runs-on: ubuntu-latest
    # The release commit and tag are pushed with a GitHub App token.
    environment: release
    permissions:
      contents: read
    outputs:
      new_release_published: ${{ steps.semrelease.outputs.released }}
      new_release_version: ${{ steps.semrelease.outputs.version }}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voucherboard/package-lock.json

      - name: Install dependencies
        working-directory: voucherboard
        run: npm ci

      - name: Run semantic-release
        id: semrelease
        working-directory: voucherboard
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

      - name: Upload release package artifact
        if: steps.semrelease.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zip
          path: voucherboard/dist/*.zip
          if-no-files-found: error
          retention-days: 90

  # Uploads the release to the Chrome Web Store (API v2) as a draft; it never submits for review.
  # A dispatch with cws_tag skips the release job and re-uploads that tag's GitHub Release zip.
  chrome-web-store:
    needs: [test, release]
    if: >-
      always() && needs.test.result == 'success' && (
        needs.release.outputs.new_release_published == 'true' || (
          github.event_name == 'workflow_dispatch' && inputs.cws_tag != '' &&
          github.ref == 'refs/heads/main' && github.actor == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    env:
      VERIFIED_CRX: ${{ vars.CWS_VERIFIED_CRX == 'true' }}
      CWS_TAG: ${{ inputs.cws_tag }}
      VERSION: ${{ needs.release.outputs.new_release_version && format('v{0}', needs.release.outputs.new_release_version) || inputs.cws_tag }}
    steps:
      - name: Check Chrome Web Store settings are configured
        id: config
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          HAVE_CRX_KEY: ${{ secrets.CWS_CRX_KEY != '' }}
        run: |
          missing=""
          for v in CWS_PUBLISHER_ID CWS_EXTENSION_ID GCP_WIF_PROVIDER CWS_SERVICE_ACCOUNT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$CWS_TAG" ] && ! [[ "$CWS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cws_tag must look like v1.2.3, not '$CWS_TAG'."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::notice::Chrome Web Store variables not configured:$missing. Skipping Chrome Web Store upload for $VERSION. See docs/RELEASING.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          elif [ "$VERIFIED_CRX" = "true" ] && [ "$HAVE_CRX_KEY" != "true" ]; then
            echo "::error::CWS_VERIFIED_CRX is true but the CWS_CRX_KEY secret is missing."
            exit 1
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release package artifact
        if: steps.config.outputs.have == 'true' && !env.CWS_TAG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zip
          path: dist

      - name: Download the tagged release's zips
        if: steps.config.outputs.have == 'true' && env.CWS_TAG
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$CWS_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'voucherboard-*.zip' --dir dist

      - name: Find the store zip
        if: steps.config.outputs.have == 'true'
        id: pkg
        run: |
          set -euo pipefail
          zip_file=$(find dist -maxdepth 1 -name '*.zip' ! -name '*-unpacked.zip' | head -n1)
          if [ -z "$zip_file" ]; then
            echo "::error::No release zip found in dist/"
            exit 1
          fi
          echo "file=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Sign the CRX
        if: steps.config.outputs.have == 'true' && env.VERIFIED_CRX == 'true'
        id: crx
        env:
          CWS_CRX_KEY: ${{ secrets.CWS_CRX_KEY }}
          ZIP_FILE: ${{ steps.pkg.outputs.file }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/crx-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CWS_CRX_KEY" > "$key"

          ext="$RUNNER_TEMP/voucherboard"
          rm -rf "$ext" "$ext.crx"
          unzip -q "$ZIP_FILE" -d "$ext"

          # A fresh profile, so the pack isn't handed to another Chrome process; xvfb because
          # Chrome on Linux won't start without a display, even just to pack.
          timeout 120 xvfb-run -a google-chrome --no-first-run --no-message-box \
            --user-data-dir="$RUNNER_TEMP/chrome-profile" \
            --pack-extension="$ext" --pack-extension-key="$key"

          if [ "$(head -c 4 "$ext.crx" 2>/dev/null)" != "Cr24" ]; then
            echo "::error::Chrome did not produce a CRX"
            exit 1
          fi
          echo "file=$ext.crx" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.have == 'true'
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Upload a draft to the Chrome Web Store
        if: steps.config.outputs.have == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
          ITEM: publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
          PACKAGE: ${{ steps.crx.outputs.file || steps.pkg.outputs.file }}
        run: |
          set -euo pipefail
          api=https://chromewebstore.googleapis.com
          auth=(-H "Authorization: Bearer $ACCESS_TOKEN")

          # call METHOD URL [curl args...]: prints the body, fails on a non-2xx status.
          call() {
            local out status
            out=$(curl -sS -w '\n%{http_code}' -X "$1" "$2" "${auth[@]}" "${@:3}")
            status=$(printf '%s' "$out" | tail -n1)
            printf '%s' "$out" | sed '$d'
            [ "${status:0:1}" = "2" ] || { echo; echo "::error::$1 $2 returned $status" >&2; return 1; }
          }

          echo "Uploading $PACKAGE"
          upload=$(call POST "$api/upload/v2/$ITEM:upload" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: $(basename "$PACKAGE")" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$PACKAGE")
          echo "Upload response: $upload"
          state=$(jq -r '.uploadState // empty' <<<"$upload")

          # Large or slow uploads are processed asynchronously: poll until they settle.
          for _ in $(seq 1 30); do
            case "$state" in IN_PROGRESS|UPLOAD_IN_PROGRESS) ;; *) break ;; esac
            sleep 10
            status=$(call GET "$api/v2/$ITEM:fetchStatus")
            state=$(jq -r '.lastAsyncUploadState // empty' <<<"$status")
            echo "Upload state: $state"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload did not succeed (state: ${state:-none})"
            exit 1
          fi

          echo "::notice::Uploaded $VERSION to the Chrome Web Store as a draft. Submit it for review in the Developer Dashboard."

      - name: Skipped notice
        if: steps.config.outputs.have != 'true'
        run: |
          echo "Chrome Web Store upload skipped: variables not configured."
