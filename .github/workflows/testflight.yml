name: TestFlight test build

# A deliberate TestFlight build of any commit, branch or tag, for testing before a release. Run it by hand
# (Actions > TestFlight test build > Run workflow, or `gh workflow run testflight.yml -f ref=<ref>`). It still waits for
# the owner's approval of the app-store environment, and never submits for review. Store releases only ever come from
# release tags, through release.yml. See docs/APP_STORE.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build"
        required: true
        type: string
        default: main

permissions:
  contents: read

# Shared with release.yml's iOS job: one App Store Connect upload at a time.
concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  ios:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ios-release.yml
    with:
      ref: ${{ inputs.ref }}
      test: true
    secrets: inherit
