name: Safari

# Builds Voucherboard for Safari (the macOS app holding the Safari web extension) on every change to it, unsigned.
# Signed, notarised builds are in safari-release.yml, which release.yml calls. See docs/SAFARI.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/safari/**"
      - "extension/manifest.json"
      - "extension/src/**"
      - "extension/guide/**"
      - "extension/icons/**"
      - ".github/workflows/safari.yml"
      - ".github/actions/setup-xcode/**"
  pull_request:
    paths:
      - "apps/safari/**"
      - "extension/manifest.json"
      - "extension/src/**"
      - "extension/guide/**"
      - "extension/icons/**"
      - ".github/workflows/safari.yml"
      - ".github/actions/setup-xcode/**"

permissions:
  contents: read

concurrency:
  group: safari-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SAFARI_DIR: apps/safari

jobs:
  build:
    name: Build (macOS, unsigned)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-xcode

      - name: Generate the Xcode project
        working-directory: ${{ env.SAFARI_DIR }}
        run: xcodegen generate

      - name: Build
        working-directory: ${{ env.SAFARI_DIR }}
        run: |
          set -euo pipefail
          xcodebuild build -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | grep -E '(error|warning:|BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"

      - name: Check the bundle
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Release/Voucherboard for Safari.app"
          res="$app/Contents/PlugIns/Voucherboard Extension.appex/Contents/Resources"
          want=$(node -p 'require("./extension/manifest.json").version')
          for p in "$app/Contents/Info.plist" "$app/Contents/PlugIns/Voucherboard Extension.appex/Contents/Info.plist"; do
            got=$(plutil -extract CFBundleShortVersionString raw "$p")
            [ "$got" = "$want" ] || { echo "::error::$p has version $got, manifest.json has $want"; exit 1; }
          done
          if plutil -extract key raw "$res/manifest.json" > /dev/null 2>&1; then
            echo "::error::The Safari manifest.json still has Chrome's key"; exit 1
          fi
          # Every file the manifest refers to (globs as their folder) is in the extension.
          node -e '
            const m = require(process.argv[1]), fs = require("fs"), out = new Set(Object.values(m.icons || {}));
            for (const cs of m.content_scripts) for (const f of [...(cs.js || []), ...(cs.css || [])]) out.add(f);
            for (const w of m.web_accessible_resources || []) for (const r of w.resources) out.add(r.replace(/\/?\*.*$/, ""));
            const missing = [...out].filter((f) => !fs.existsSync(process.argv[2] + "/" + f));
            if (missing.length) { console.log("::error::Missing from the extension: " + missing.join(", ")); process.exit(1); }
            console.log(`Extension ${m.version} has all ${out.size} files and folders the manifest refers to.`);
          ' "$res/manifest.json" "$res"
