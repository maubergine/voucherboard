name: CodeQL (Swift)

# Code scanning for the Swift in the iOS app and Voucherboard for Safari. CodeQL has to watch the compiler, and both
# Xcode projects are generated by XcodeGen, so this generates and builds them, unsigned, as ios.yml and safari.yml do.
# Runs on Swift changes and weekly, not on every PR, to keep Mac runners free.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/ios/**"
      - "apps/safari/**"
      - ".github/workflows/codeql-swift.yml"
      - ".github/actions/setup-xcode/**"
  pull_request:
    paths:
      - "apps/mobile/ios/**"
      - "apps/safari/**"
      - ".github/workflows/codeql-swift.yml"
      - ".github/actions/setup-xcode/**"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-xcode

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual

      - name: Build the iOS app
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd-ios" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/ios.log" | grep -E '(error|BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/ios.log"

      - name: Build Voucherboard for Safari
        working-directory: apps/safari
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd-safari" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/safari.log" | grep -E '(error|BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/safari.log"

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift
