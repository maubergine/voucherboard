name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voucherboard/package-lock.json

      - name: Install dependencies
        working-directory: voucherboard
        run: npm ci

      - name: Validate manifest.json
        working-directory: voucherboard
        run: npm run validate-manifest

      - name: Run tests
        working-directory: voucherboard
        run: npm test

      - name: Check the guide (bundled and docs/guide) is up to date
        working-directory: voucherboard
        run: node scripts/render-guide.mjs --check

      - name: Check the website's other pages (docs/) are up to date
        working-directory: voucherboard
        run: node scripts/render-pages.mjs --check

      - name: Build package
        working-directory: voucherboard
        run: npm run package

      - name: Build Firefox package
        working-directory: voucherboard
        run: npm run package:firefox

      - name: Lint Firefox package
        working-directory: voucherboard
        run: npm run lint:firefox

      - name: Upload package artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voucherboard-zip
          path: voucherboard/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      # Local runs (ci/local.sh, under act): act's artifact server can't take upload-artifact v7, so the zips are
      # copied to the folder ci/local.sh mounts at /vb-out.
      - name: Copy the zips out (local runs)
        if: ${{ env.ACT }}
        working-directory: voucherboard/dist
        run: |
          [ -d /vb-out ] || { echo "No /vb-out mounted: not copying."; exit 0; }
          cp -- *.zip /vb-out/ && cd /vb-out && sha256sum -- *.zip > SHA256SUMS && ls -1
