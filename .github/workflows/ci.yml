name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest.json
        run: npm run validate-manifest

      - name: Run tests
        run: npm test

      - name: Check the bundled guide is up to date
        run: node scripts/render-guide.mjs --check

      - name: Build the zips and SHA256SUMS
        run: npm run dist

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Upload package artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voucherboard-dist
          path: |
            dist/voucherboard-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # Local runs (ci/local.sh, under act): act's artifact server can't take upload-artifact v7, so the zips are
      # copied to the folder ci/local.sh mounts at /vb-out.
      - name: Copy the zips out (local runs)
        if: ${{ env.ACT }}
        working-directory: dist
        run: |
          [ -d /vb-out ] || { echo "No /vb-out mounted: not copying."; exit 0; }
          cp -- voucherboard-*.zip SHA256SUMS /vb-out/ && ls -1 /vb-out
