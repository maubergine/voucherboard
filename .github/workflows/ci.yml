name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voucherboard/package-lock.json

      - name: Install dependencies
        working-directory: voucherboard
        run: npm ci

      - name: Validate manifest.json
        working-directory: voucherboard
        run: npm run validate-manifest

      - name: Run tests
        working-directory: voucherboard
        run: npm test

      - name: Check rendered guide is up to date
        if: hashFiles('voucherboard/scripts/render-guide.mjs') != ''
        working-directory: voucherboard
        run: node scripts/render-guide.mjs --check

      - name: Check privacy and support pages are up to date
        working-directory: voucherboard
        run: node scripts/render-pages.mjs --check

      - name: Build package
        working-directory: voucherboard
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voucherboard-zip
          path: voucherboard/dist/*.zip
          if-no-files-found: error
          retention-days: 14
