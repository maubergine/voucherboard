name: Website

# Builds https://voucherboard.mariusrubin.com/ from site/ and the guide (scripts/render-pages.mjs) and deploys it to
# GitHub Pages. Nothing built is committed. Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "extension/guide/**"
      - "scripts/render-pages.mjs"
      - "scripts/render-guide.mjs"
      - "scripts/lib/site.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "extension/guide/**"
      - "scripts/render-pages.mjs"
      - "scripts/render-guide.mjs"
      - "scripts/lib/site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # No dependencies: the renderers use Node's standard library only.
      - name: Build the site
        run: node scripts/render-pages.mjs --out build/site

      - name: Upload the site
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  # Pull requests only build: a broken page fails the check without going live.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
