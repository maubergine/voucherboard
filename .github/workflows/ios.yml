name: iOS

# Builds the iOS app on every change to it, and uploads a signed build to TestFlight when the owner asks.
# It never submits for App Review: the owner does that in App Store Connect. See docs/APP_STORE.md.

on:
  push:
    branches: [main, feat/ios-app]
    paths:
      - "voucherboard/mobile/**"
      - "voucherboard/src/**"
      - "voucherboard/package.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "voucherboard/mobile/**"
      - "voucherboard/src/**"
      - "voucherboard/package.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload this commit to TestFlight (needs the app-store environment's approval)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}-${{ inputs.testflight && 'tf' || 'build' }}
  cancel-in-progress: ${{ !inputs.testflight }}

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  IOS_DIR: voucherboard/mobile/ios

jobs:
  build:
    name: Build (Simulator, unsigned)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &select-xcode
        name: Select Xcode
        run: |
          set -euo pipefail
          # Newest release Xcode on the runner; App Store uploads need a current SDK.
          x=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.candidate' | sort -V | tail -n1)
          major=$(basename "$x" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then echo "::error::Need Xcode 26 or later, found $x"; exit 1; fi
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version

      - &install-xcodegen
        name: Install XcodeGen (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLf -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - &generate
        name: Generate the Xcode project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Build for the Simulator
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          xcodebuild build -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | grep -E '(error|warning:|BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"

      - name: Check the bundle
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name Voucherboard.app -type d | head -n1)
          for f in www/engine.html www/core/plates.js www/core/terms.js council/council.js council/buyfill.js \
                   PlugIns/VoucherboardShare.appex PlugIns/VoucherboardLive.appex; do
            [ -e "$app/$f" ] || { echo "::error::$f is missing from the app bundle"; exit 1; }
          done
          echo "Bundle has the engine, council scripts and both extensions."

  # Signs with the owner's Apple Distribution certificate in a throwaway keychain and uploads to App Store Connect.
  # Runs only on a manual dispatch by the repository owner, and only after the app-store environment is approved.
  testflight:
    name: Upload to TestFlight
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.testflight &&
      github.actor == github.repository_owner && github.repository == 'maubergine/voucherboard'
    runs-on: macos-26
    timeout-minutes: 45
    environment: app-store
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - name: Check App Store settings are configured
        env:
          HAVE_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAVE_P12: ${{ secrets.IOS_DIST_CERT_P12 != '' }}
          HAVE_P12_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          HAVE_APP: ${{ secrets.IOS_PROFILE_APP != '' }}
          HAVE_SHARE: ${{ secrets.IOS_PROFILE_SHARE != '' }}
          HAVE_LIVE: ${{ secrets.IOS_PROFILE_LIVE != '' }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          for v in P8 P12 P12_PW APP SHARE LIVE; do n="HAVE_$v"; [ "${!n}" = "true" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::app-store environment settings missing:$missing. See docs/APP_STORE.md, 'Automated signing and upload'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *select-xcode
      - *install-xcodegen
      - *generate

      - name: Work out the version and build number
        id: ver
        run: |
          set -euo pipefail
          version=$(node -p 'require("./voucherboard/package.json").version')
          bundle=$(sed -nE 's/^ *APP_BUNDLE_ID: *([^ #]+).*/\1/p' "$IOS_DIR/project.yml")
          [ -n "$bundle" ] || { echo "::error::APP_BUNDLE_ID not found in project.yml"; exit 1; }
          { echo "version=$version"; echo "build=${{ github.run_number }}"; echo "bundle=$bundle"; } >> "$GITHUB_OUTPUT"
          echo "Version $version, build ${{ github.run_number }}, bundle $bundle"

      - name: Install the signing certificate and profiles
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_SHARE: ${{ secrets.IOS_PROFILE_SHARE }}
          IOS_PROFILE_LIVE: ${{ secrets.IOS_PROFILE_LIVE }}
          BUNDLE: ${{ steps.ver.outputs.bundle }}
        run: |
          set -euo pipefail
          umask 077
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          kc="$S/vb.keychain-db"; kcpw=$(openssl rand -hex 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 2700 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$S/dist.p12"
          security import "$S/dist.p12" -k "$kc" -P "$IOS_DIST_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$S/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          others=(); while IFS= read -r k; do others+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${others[@]}"
          # Apple Distribution certificates chain to the WWDR G3 intermediate (valid to 2030).
          curl -sSLf -o "$S/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          echo "dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f  $S/wwdr.cer" | shasum -a 256 -c -
          security import "$S/wwdr.cer" -k "$kc" > /dev/null
          security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution" \
            || { echo "::error::IOS_DIST_CERT_P12 holds no Apple Distribution identity"; exit 1; }
          echo "VB_KEYCHAIN=$kc" >> "$GITHUB_ENV"

          dirs=("$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles")
          mkdir -p "${dirs[@]}"
          now=$(date -u +%s)
          for t in APP SHARE LIVE; do
            case $t in APP) id="$BUNDLE";; SHARE) id="$BUNDLE.share";; LIVE) id="$BUNDLE.live";; esac
            var="IOS_PROFILE_$t"; f="$S/$t.mobileprovision"; p="$S/$t.plist"
            printf '%s' "${!var}" | base64 --decode > "$f"
            security cms -D -i "$f" > "$p"
            uuid=$(plutil -extract UUID raw "$p")
            appid=$(plutil -extract Entitlements.application-identifier raw "$p")
            debug=$(plutil -extract Entitlements.get-task-allow raw "$p" 2>/dev/null || echo false)
            exp=$(plutil -extract ExpirationDate raw "$p")
            if [ "$appid" != "$APPLE_TEAM_ID.$id" ]; then echo "::error::IOS_PROFILE_$t is for $appid, not $APPLE_TEAM_ID.$id"; exit 1; fi
            if [ "$debug" = "true" ] || plutil -extract ProvisionedDevices raw "$p" > /dev/null 2>&1; then
              echo "::error::IOS_PROFILE_$t is a development or ad hoc profile. Use an App Store Connect profile."; exit 1
            fi
            left=$(( ($(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$exp" +%s) - now) / 86400 ))
            if [ "$left" -lt 0 ]; then echo "::error::IOS_PROFILE_$t expired on $exp. Renew it (docs/APP_STORE.md)."; exit 1; fi
            if [ "$left" -lt 30 ]; then echo "::warning::IOS_PROFILE_$t expires in $left days ($exp). Renew it soon."; fi
            for d in "${dirs[@]}"; do cp "$f" "$d/$uuid.mobileprovision"; done
            echo "VB_PROFILE_$t=$uuid" >> "$GITHUB_ENV"
          done

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/signing/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "VB_ASC_KEY=$key" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ${{ env.IOS_DIR }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Voucherboard.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $VB_KEYCHAIN" \
            VB_PROFILE_APP="$VB_PROFILE_APP" VB_PROFILE_SHARE="$VB_PROFILE_SHARE" VB_PROFILE_LIVE="$VB_PROFILE_LIVE" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '(error|warning:|ARCHIVE)' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"

      - name: Check the archive is a release build
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Voucherboard.xcarchive/Products/Applications/Voucherboard.app"
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/ent.plist" 2>/dev/null
          if [ "$(plutil -extract get-task-allow raw "$RUNNER_TEMP/ent.plist" 2>/dev/null || echo false)" = "true" ]; then
            echo "::error::The archive is signed for debugging"; exit 1
          fi
          plutil -extract com.apple.security.application-groups raw "$RUNNER_TEMP/ent.plist" > /dev/null \
            || { echo "::error::The signed app has no App Group entitlement"; exit 1; }

      - name: Export and upload to App Store Connect
        env:
          BUNDLE: ${{ steps.ver.outputs.bundle }}
        run: |
          set -euo pipefail
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$opts" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE}</key><string>${VB_PROFILE_APP}</string>
              <key>${BUNDLE}.share</key><string>${VB_PROFILE_SHARE}</string>
              <key>${BUNDLE}.live</key><string>${VB_PROFILE_LIVE}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          plutil -lint "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Voucherboard.xcarchive" \
            -exportOptionsPlist "$opts" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$VB_ASC_KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          {
            echo "### Uploaded $VERSION ($BUILD) to App Store Connect"
            echo
            echo "It appears in TestFlight once Apple has processed it (usually 5 to 30 minutes)."
            echo "Nothing has been submitted for review. Submit it yourself in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${VB_KEYCHAIN:-}" ]; then security delete-keychain "$VB_KEYCHAIN" || true; fi
          for t in APP SHARE LIVE; do
            v="VB_PROFILE_$t"; [ -n "${!v:-}" ] || continue
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${!v}.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${!v}.mobileprovision"
          done
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/Voucherboard.xcarchive" "$RUNNER_TEMP/export"
