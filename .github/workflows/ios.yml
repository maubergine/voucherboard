name: iOS

# Builds the iOS app on every change to it, unsigned. Signed TestFlight uploads are in ios-testflight.yml, which
# release.yml calls. See docs/APP_STORE.md.

on:
  push:
    branches: [main]
    paths:
      - "voucherboard/mobile/**"
      - "voucherboard/src/**"
      - "voucherboard/package.json"
      - ".github/workflows/ios.yml"
      - ".github/actions/setup-xcode/**"
  pull_request:
    paths:
      - "voucherboard/mobile/**"
      - "voucherboard/src/**"
      - "voucherboard/package.json"
      - ".github/workflows/ios.yml"
      - ".github/actions/setup-xcode/**"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IOS_DIR: voucherboard/mobile/ios

jobs:
  build:
    name: Build (Simulator, unsigned)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-xcode

      - name: Generate the Xcode project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Build for the Simulator
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          xcodebuild build -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | grep -E '(error|warning:|BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"

      - name: Check the bundle
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name Voucherboard.app -type d | head -n1)
          for f in www/engine.html www/demo.js www/core/plates.js www/core/terms.js council/council.js council/buyfill.js \
                   PlugIns/VoucherboardShare.appex PlugIns/VoucherboardLive.appex; do
            [ -e "$app/$f" ] || { echo "::error::$f is missing from the app bundle"; exit 1; }
          done
          echo "Bundle has the engine, council scripts and both extensions."
