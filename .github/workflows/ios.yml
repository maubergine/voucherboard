name: iOS

# Builds the iOS app on every change to it, unsigned. Signed TestFlight uploads are in ios-testflight.yml, which
# release.yml calls. See docs/APP_STORE.md.

on:
  push:
    branches: [main]
    paths:
      - "voucherboard/mobile/**"
      - "voucherboard/src/**"
      - "voucherboard/package.json"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "voucherboard/mobile/**"
      - "voucherboard/src/**"
      - "voucherboard/package.json"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  IOS_DIR: voucherboard/mobile/ios

jobs:
  build:
    name: Build (Simulator, unsigned)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Newest release Xcode on the runner; App Store uploads need a current SDK.
          x=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.candidate' | sort -V | tail -n1)
          major=$(basename "$x" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')
          if [ "$major" -lt 27 ]; then echo "::error::Need Xcode 27 or later, found $x"; exit 1; fi
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSLf -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Build for the Simulator
        working-directory: ${{ env.IOS_DIR }}
        run: |
          set -euo pipefail
          xcodebuild build -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | grep -E '(error|warning:|BUILD)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/build.log"

      - name: Check the bundle
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name Voucherboard.app -type d | head -n1)
          for f in www/engine.html www/demo.js www/core/plates.js www/core/terms.js council/council.js council/buyfill.js \
                   PlugIns/VoucherboardShare.appex PlugIns/VoucherboardLive.appex; do
            [ -e "$app/$f" ] || { echo "::error::$f is missing from the app bundle"; exit 1; }
          done
          echo "Bundle has the engine, council scripts and both extensions."
