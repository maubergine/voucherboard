name: iOS release

# Signs a build and uploads it to App Store Connect, for TestFlight, only after the owner approves the app-store
# environment. Called three ways:
#   release.yml     an ios-v* release tag, at the tag's version: the final build of that version, the one to submit
#   release.yml     a push to main that changes the app: main's commit, at the version the open iOS release pull request
#                   proposes (test: true, version)
#   testflight.yml  by hand, main or the iOS release branch (test: true)
#   testflight-refresh.yml  daily (refresh: true): once the newest upload is `days` old, and nothing has been uploaded
#                   since, uploads it again with a new build number before TestFlight expires it (90 days). It re-signs
#                   the archive that upload's run saved and attested (artefact ios-archive), in the
#                   app-store-refresh environment, which has no reviewers: the owner approved that build once. With the
#                   archive gone, it rebuilds the release tag instead, after approval of app-store.
# Every upload saves its archive for that. It never submits for App Review: the owner does that in App Store Connect. See docs/APP_STORE.md.

on:
  workflow_call:
    inputs:
      ref:
        description: "An ios-v* release tag; for a test build, a commit or branch"
        required: true
        type: string
      version:
        description: "A test build's version (default: project.yml's at ref)"
        required: false
        type: string
        default: ""
      test:
        description: "A test build: no release tag needed"
        required: false
        type: boolean
        default: false
      force:
        description: "Upload even if this tag or commit was uploaded before"
        required: false
        type: boolean
        default: false
      refresh:
        description: "Upload the newest TestFlight build again if it's `days` old (ref is only where the scripts come from)"
        required: false
        type: boolean
        default: false
      days:
        description: "With refresh: the newest upload's age, in days, that makes it due"
        required: false
        type: number
        default: 60

permissions:
  contents: read

env:
  IOS_DIR: apps/mobile/ios

jobs:
  # Works out what to build (the commit, its version) and checks it hasn't been uploaded already (a re-run, or a run
  # that waited behind another), before the approval is asked for. Has no secrets.
  check:
    name: Check what to upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      actions: read # refresh: whether the upload's archive is still there
    outputs:
      sha: ${{ steps.ver.outputs.sha || steps.refresh.outputs.sha }}
      version: ${{ steps.ver.outputs.version || steps.refresh.outputs.version }}
      url: ${{ steps.ver.outputs.url || steps.refresh.outputs.url }}
      archive_run: ${{ steps.refresh.outputs.archive_run }}
      # Whether to skip the upload: already sent, or (refresh) not due.
      deployed: ${{ steps.deployed.outputs.deployed || (inputs.refresh && steps.refresh.outputs.due != 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # A refresh may rebuild a release tag, so it needs the tags.
          fetch-depth: ${{ inputs.refresh && '0' || '1' }}
          persist-credentials: false

      - name: Find the upload to refresh
        id: refresh
        if: inputs.refresh
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days }}
        run: node scripts/testflight-refresh.mjs

      - name: Work out the commit and version
        id: ver
        if: ${{ !inputs.refresh }}
        env:
          REF: ${{ inputs.ref }}
          TEST: ${{ inputs.test }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          at_ref=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' "$IOS_DIR/project.yml")
          if [ "$TEST" = "true" ]; then
            version=${VERSION:-$at_ref}
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$sha"
          else
            if [[ "$REF" != ios-v* ]] || ! git rev-parse -q --verify "refs/tags/$REF" > /dev/null; then
              echo "::error::$REF isn't an ios-v* release tag"; exit 1
            fi
            [ "$REF" = "ios-v$at_ref" ] || { echo "::error::apps/mobile/ios/project.yml at $REF says $at_ref"; exit 1; }
            version=$at_ref
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$REF"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a version: $version"; exit 1; }
          { echo "sha=$sha"; echo "version=$version"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "Version $version of $REF ($sha)$([ "$TEST" = true ] && echo ", test build")"

      - name: Look for an earlier upload
        id: deployed
        if: ${{ !inputs.force && !inputs.refresh }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.ver.outputs.url }}
        run: node scripts/deployed.mjs app-store "$URL"

  # Signs with the owner's Apple Distribution certificate in a throwaway keychain and uploads to App Store Connect.
  testflight:
    name: Upload to TestFlight
    needs: check
    if: needs.check.outputs.deployed != 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # a refresh downloads the archive
      id-token: write # the archive's provenance attestation
      attestations: write
    environment:
      # A refresh re-signing an approved build's own archive needs no approval; anything built needs the owner's.
      name: ${{ needs.check.outputs.archive_run != '' && 'app-store-refresh' || 'app-store' }}
      # The tag or commit uploaded: deployed.mjs and testflight-refresh.mjs look for it. A refresh keeps the URL.
      url: ${{ needs.check.outputs.url }}
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - name: Check App Store settings are configured
        env:
          HAVE_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAVE_P12: ${{ secrets.IOS_DIST_CERT_P12 != '' }}
          HAVE_P12_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD != '' }}
          HAVE_APP: ${{ secrets.IOS_PROFILE_APP != '' }}
          HAVE_SHARE: ${{ secrets.IOS_PROFILE_SHARE != '' }}
          HAVE_LIVE: ${{ secrets.IOS_PROFILE_LIVE != '' }}
          ENV_NAME: ${{ needs.check.outputs.archive_run != '' && 'app-store-refresh' || 'app-store' }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          for v in P8 P12 P12_PW APP SHARE LIVE; do n="HAVE_$v"; [ "${!n}" = "true" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::$ENV_NAME environment settings missing:$missing. See docs/APP_STORE.md, step 7."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the check job looked at, even if a branch has moved since. A re-sign, which has no approval,
          # runs main's own commit instead (this workflow's), never a tag's, which could have been moved.
          ref: ${{ needs.check.outputs.archive_run != '' && github.sha || needs.check.outputs.sha || inputs.ref }}
          persist-credentials: false

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-xcode

      - name: Fetch the archive to re-sign
        id: reuse
        if: needs.check.outputs.archive_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.check.outputs.archive_run }}
          EXPECT: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          want=$(sed -nE 's/^ *APP_BUNDLE_ID: *([^ #]+).*/\1/p' "$IOS_DIR/project.yml")
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n ios-archive -D "$RUNNER_TEMP/prev"
          zip="$RUNNER_TEMP/prev/Voucherboard.xcarchive.zip"
          # Only an archive this workflow attested on main, in that same run: not one another job uploaded.
          [[ "$RUN" =~ ^[0-9]+$ ]]
          runs=$(gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ios-release.yml" \
            --format json --jq '.[].verificationResult.signature.certificate.runInvocationURI')
          grep -q "/actions/runs/$RUN/" <<< "$runs" || { echo "::error::The archive in run $RUN wasn't attested by that run"; exit 1; }
          ditto -x -k "$zip" "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/prev"
          a="$RUNNER_TEMP/Voucherboard.xcarchive"
          version=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" "$a/Info.plist")
          bundle=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$a/Products/Applications/Voucherboard.app/Info.plist")
          [ -z "$EXPECT" ] || [ "$version" = "$EXPECT" ] || { echo "::error::The archive is $version, not $EXPECT"; exit 1; }
          [ "$bundle" = "$want" ] || { echo "::error::The archive is $bundle, not $want"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Archive of $version ($bundle) from run $RUN"

      - name: Generate the Xcode project
        if: needs.check.outputs.archive_run == ''
        working-directory: ${{ env.IOS_DIR }}
        run: xcodegen generate

      - name: Work out the build number
        id: ver
        env:
          VERSION: ${{ steps.reuse.outputs.version || needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # A UTC timestamp: always higher than the last upload, of any version (the old scheme, 100 plus the release
          # run's number, stopped below 1000).
          build=$(date -u +%Y%m%d.%H%M%S)
          bundle=$(sed -nE 's/^ *APP_BUNDLE_ID: *([^ #]+).*/\1/p' "$IOS_DIR/project.yml")
          [ -n "$bundle" ] || { echo "::error::APP_BUNDLE_ID not found in project.yml"; exit 1; }
          { echo "version=$VERSION"; echo "build=$build"; echo "bundle=$bundle"; } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $build, bundle $bundle, commit $(git rev-parse HEAD)"

      - name: Install the signing certificate and profiles
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_SHARE: ${{ secrets.IOS_PROFILE_SHARE }}
          IOS_PROFILE_LIVE: ${{ secrets.IOS_PROFILE_LIVE }}
          BUNDLE: ${{ steps.ver.outputs.bundle }}
        run: |
          set -euo pipefail
          umask 077
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          kc="$S/vb.keychain-db"; kcpw=$(openssl rand -hex 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 2700 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$S/dist.p12"
          security import "$S/dist.p12" -k "$kc" -P "$IOS_DIST_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$S/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          others=(); while IFS= read -r k; do others+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${others[@]}"
          # Apple Distribution certificates chain to the WWDR G3 intermediate (valid to 2030).
          # A .p12 exported with its chain already holds it, and a second import fails.
          wwdr=dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f
          curl -sSLf -o "$S/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          echo "$wwdr  $S/wwdr.cer" | shasum -a 256 -c -
          security find-certificate -a -Z "$kc" | grep -qi "SHA-256 hash: $wwdr" \
            || security import "$S/wwdr.cer" -k "$kc" > /dev/null
          security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution" \
            || { echo "::error::IOS_DIST_CERT_P12 holds no Apple Distribution identity"; exit 1; }
          echo "VB_KEYCHAIN=$kc" >> "$GITHUB_ENV"

          dirs=("$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles")
          mkdir -p "${dirs[@]}"
          now=$(date -u +%s)
          for t in APP SHARE LIVE; do
            case $t in APP) id="$BUNDLE";; SHARE) id="$BUNDLE.share";; LIVE) id="$BUNDLE.live";; esac
            var="IOS_PROFILE_$t"; f="$S/$t.mobileprovision"; p="$S/$t.plist"
            printf '%s' "${!var}" | base64 --decode > "$f"
            security cms -D -i "$f" > "$p"
            uuid=$(plutil -extract UUID raw "$p")
            appid=$(plutil -extract Entitlements.application-identifier raw "$p")
            debug=$(plutil -extract Entitlements.get-task-allow raw "$p" 2>/dev/null || echo false)
            exp=$(plutil -extract ExpirationDate raw "$p")
            if [ "$appid" != "$APPLE_TEAM_ID.$id" ]; then echo "::error::IOS_PROFILE_$t is for $appid, not $APPLE_TEAM_ID.$id"; exit 1; fi
            if [ "$debug" = "true" ] || plutil -extract ProvisionedDevices raw "$p" > /dev/null 2>&1; then
              echo "::error::IOS_PROFILE_$t is a development or ad hoc profile. Use an App Store Connect profile."; exit 1
            fi
            left=$(( ($(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$exp" +%s) - now) / 86400 ))
            if [ "$left" -lt 0 ]; then echo "::error::IOS_PROFILE_$t expired on $exp. Renew it (docs/APP_STORE.md)."; exit 1; fi
            if [ "$left" -lt 30 ]; then echo "::warning::IOS_PROFILE_$t expires in $left days ($exp). Renew it soon."; fi
            for d in "${dirs[@]}"; do cp "$f" "$d/$uuid.mobileprovision"; done
            echo "VB_PROFILE_$t=$uuid" >> "$GITHUB_ENV"
          done

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/signing/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "VB_ASC_KEY=$key" >> "$GITHUB_ENV"

      - name: Archive
        if: needs.check.outputs.archive_run == ''
        working-directory: ${{ env.IOS_DIR }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Voucherboard.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $VB_KEYCHAIN" \
            VB_PROFILE_APP="$VB_PROFILE_APP" VB_PROFILE_SHARE="$VB_PROFILE_SHARE" VB_PROFILE_LIVE="$VB_PROFILE_LIVE" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '(error|warning:|ARCHIVE)' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"

      # The same binary with a new build number: export re-signs every bundle with the profiles below.
      - name: Give the archive a new build number
        if: needs.check.outputs.archive_run != ''
        env:
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/Voucherboard.xcarchive"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD" "$a/Info.plist"
          for p in "$a/Products/Applications/Voucherboard.app/Info.plist" "$a"/Products/Applications/Voucherboard.app/PlugIns/*.appex/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$p"
          done

      - name: Check the archive is a release build
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Voucherboard.xcarchive/Products/Applications/Voucherboard.app"
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/ent.plist" 2>/dev/null
          if [ "$(plutil -extract get-task-allow raw "$RUNNER_TEMP/ent.plist" 2>/dev/null || echo false)" = "true" ]; then
            echo "::error::The archive is signed for debugging"; exit 1
          fi
          # PlistBuddy, not plutil: plutil reads the dots in the key as a key path.
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$RUNNER_TEMP/ent.plist" > /dev/null 2>&1 \
            || { echo "::error::The signed app has no App Group entitlement"; exit 1; }

      # Kept for testflight-refresh.yml, which re-signs it before this build expires. 90 days: GitHub's limit for a
      # public repository; a refresh saves it again.
      - name: Save the archive
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Voucherboard.xcarchive" "$RUNNER_TEMP/Voucherboard.xcarchive.zip"

      - name: Attest the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/Voucherboard.xcarchive.zip

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive
          path: ${{ runner.temp }}/Voucherboard.xcarchive.zip
          retention-days: 90
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Export and upload to App Store Connect
        env:
          BUNDLE: ${{ steps.ver.outputs.bundle }}
        run: |
          set -euo pipefail
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$opts" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE}</key><string>${VB_PROFILE_APP}</string>
              <key>${BUNDLE}.share</key><string>${VB_PROFILE_SHARE}</string>
              <key>${BUNDLE}.live</key><string>${VB_PROFILE_LIVE}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          plutil -lint "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Voucherboard.xcarchive" \
            -exportOptionsPlist "$opts" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$VB_ASC_KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          REF: ${{ inputs.ref }}
          TEST: ${{ inputs.test }}
          REFRESH: ${{ inputs.refresh }}
          URL: ${{ needs.check.outputs.url }}
          REUSED: ${{ needs.check.outputs.archive_run }}
        run: |
          {
            echo "### Uploaded $VERSION ($BUILD) to App Store Connect"
            echo
            if [ "$REFRESH" = "true" ]; then
              echo "Refresh of $URL before TestFlight expires it: $([ -n "$REUSED" ] && echo "its archive from run $REUSED, re-signed" || echo "rebuilt")."
            elif [ "$TEST" = "true" ]; then
              echo "Test build of $REF ($(git rev-parse --short HEAD)) at the pending version. Use it for testing only:"
              echo "submit the build of the ios-v$VERSION release."
            else
              echo "Release $REF: the build to submit for review."
            fi
            echo
            echo "It appears in TestFlight once Apple has processed it (usually 5 to 30 minutes)."
            echo "Nothing has been submitted for review. Submit it yourself in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${VB_KEYCHAIN:-}" ]; then security delete-keychain "$VB_KEYCHAIN" || true; fi
          for t in APP SHARE LIVE; do
            v="VB_PROFILE_$t"; [ -n "${!v:-}" ] || continue
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${!v}.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${!v}.mobileprovision"
          done
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/Voucherboard.xcarchive" "$RUNNER_TEMP/Voucherboard.xcarchive.zip" "$RUNNER_TEMP/export"
