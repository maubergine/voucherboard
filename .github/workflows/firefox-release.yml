name: Firefox release

# Takes the Firefox zip attached to a firefox-v* release, lints it with web-ext and has addons.mozilla.org validate it.
# Called by release.yml for each Firefox release, and only after the owner approves the firefox-amo environment.
#
# It never creates an AMO version: a listed version is submitted for review the moment it's created, and an
# unlisted one would use up the version number. The owner uploads the release's zip in the Developer Hub.
# See docs/FIREFOX.md.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release to build"
        required: true
        type: string
      force:
        description: "Offer it even if it was sent before"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Checks, before asking for approval, that this release hasn't already gone to firefox-amo (a re-run, or a
  # run that waited behind another). Which platforms have something new is release-please's job.
  check:
    name: Check it hasn't been handed over
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deployed: ${{ steps.deployed.outputs.deployed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for an earlier hand-over
        id: deployed
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
        run: node scripts/deployed.mjs firefox-amo "$URL"

  amo:
    name: Build and validate for AMO
    needs: check
    if: needs.check.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: firefox-amo
      # The release handed over: deployed.mjs looks for it.
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Check AMO settings are configured
        env:
          HAVE_ISSUER: ${{ secrets.AMO_JWT_ISSUER != '' }}
          HAVE_SECRET: ${{ secrets.AMO_JWT_SECRET != '' }}
        run: |
          missing=""
          [ "$HAVE_ISSUER" = "true" ] || missing="$missing AMO_JWT_ISSUER"
          [ "$HAVE_SECRET" = "true" ] || missing="$missing AMO_JWT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::firefox-amo environment secrets missing:$missing. See docs/FIREFOX.md."
            exit 1
          fi

      # This commit's tools (web-ext, amo-validate.mjs); the zip itself comes from the release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # No dependency cache where secrets are in reach: a cache written by another run on main could be restored here.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Download the release's Firefox zip
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          f="voucherboard-firefox-${TAG#firefox-v}.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f" --pattern SHA256SUMS --dir dist \
            || { echo "::error::$TAG has no $f."; exit 1; }
          (cd dist && sha256sum -c --ignore-missing --strict SHA256SUMS)
          grep -q "  $f\$" dist/SHA256SUMS || { echo "::error::SHA256SUMS doesn't cover $f"; exit 1; }
          echo "file=dist/$f" >> "$GITHUB_OUTPUT"

      - name: Lint with web-ext
        env:
          ZIP_FILE: ${{ steps.pkg.outputs.file }}
        run: |
          set -euo pipefail
          rm -rf build/firefox && mkdir -p build/firefox && unzip -q "$ZIP_FILE" -d build/firefox
          npx web-ext lint --source-dir build/firefox

      # Validation only: the upload creates no version and submits nothing for review.
      - name: Validate on addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          ZIP_FILE: ${{ steps.pkg.outputs.file }}
        run: node scripts/amo-validate.mjs "$ZIP_FILE"

      - name: Next step
        env:
          TAG: ${{ inputs.tag }}
        run: echo "::notice::$TAG is ready for Firefox. Download voucherboard-firefox-${TAG#firefox-v}.zip from the $TAG release and upload it in the AMO Developer Hub (docs/FIREFOX.md)."
