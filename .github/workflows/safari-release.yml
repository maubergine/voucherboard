name: Safari release

# Signs Voucherboard for Safari with the owner's Developer ID, notarises and staples it, and attaches the zip to the
# release. Called by release.yml when the Safari app's files have changed since the last signed release, and only
# after the owner approves the safari environment. Nothing goes to the Mac App Store. See docs/SAFARI.md.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build and attach to"
        required: true
        type: string
      force:
        description: "none, safari or all: sign even if nothing changed"
        required: false
        type: string
        default: none

permissions:
  contents: read

env:
  SAFARI_DIR: voucherboard/safari

jobs:
  # Checks again, now that any earlier run has finished (release.yml runs one of these at a time), so a release that an
  # earlier run already signed isn't offered twice. Runs before the approval is asked for.
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      changed: ${{ steps.changes.outputs.safari }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the last signed release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          VB_FORCE: ${{ inputs.force }}
          VB_SAFARI_TAG: ${{ inputs.tag }}
        run: node voucherboard/scripts/store-changes.mjs safari

  # Signs with the Developer ID Application certificate in a throwaway keychain, notarises with an App Store Connect
  # API key, staples, and uploads the zip to the GitHub release.
  sign:
    name: Sign, notarise and attach
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write # gh release upload
    environment:
      name: safari
      # The release signed: store-changes.mjs compares the next one with it.
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
    env:
      TAG: ${{ inputs.tag }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - name: Check Safari settings are configured
        env:
          HAVE_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAVE_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 != '' }}
          HAVE_P12_PW: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD != '' }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!v}" ] || missing="$missing $v"; done
          [ "$HAVE_P8" = "true" ] || missing="$missing ASC_KEY_P8"
          [ "$HAVE_P12" = "true" ] || missing="$missing MAC_DEVELOPER_ID_P12"
          [ "$HAVE_P12_PW" = "true" ] || missing="$missing MAC_DEVELOPER_ID_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::safari environment settings missing:$missing. See docs/SAFARI.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-xcode

      - name: Generate the Xcode project
        working-directory: ${{ env.SAFARI_DIR }}
        run: xcodegen generate

      - name: Work out the version and build number
        id: ver
        run: |
          set -euo pipefail
          version=$(node -p 'require("./voucherboard/manifest.json").version')
          if [ "v$version" != "$TAG" ]; then echo "::error::manifest.json at $TAG says $version"; exit 1; fi
          build=$GITHUB_RUN_NUMBER
          { echo "version=$version"; echo "build=$build"; echo "zip=Voucherboard-Safari-$version.zip"; } >> "$GITHUB_OUTPUT"
          echo "Version $version, build $build"

      - name: Install the signing certificate
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          S="$RUNNER_TEMP/signing"; mkdir -p "$S"
          kc="$S/vb.keychain-db"; kcpw=$(openssl rand -hex 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$MAC_DEVELOPER_ID_P12" | base64 --decode > "$S/devid.p12"
          security import "$S/devid.p12" -k "$kc" -P "$MAC_DEVELOPER_ID_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$S/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          others=(); while IFS= read -r k; do others+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${others[@]}"
          # Developer ID certificates chain to the Developer ID G2 intermediate (valid to 2031).
          # A .p12 exported with its chain already holds it, and a second import fails.
          g2=f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
          curl -sSLf -o "$S/g2.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$g2  $S/g2.cer" | shasum -a 256 -c -
          security find-certificate -a -Z "$kc" | grep -qi "SHA-256 hash: $g2" \
            || security import "$S/g2.cer" -k "$kc" > /dev/null
          ids=$(security find-identity -v -p codesigning "$kc")
          echo "$ids" | grep -q "Developer ID Application: .*($APPLE_TEAM_ID)" \
            || { echo "::error::MAC_DEVELOPER_ID_P12 holds no Developer ID Application identity for team $APPLE_TEAM_ID"; exit 1; }
          echo "VB_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/signing/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "VB_ASC_KEY=$key" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ${{ env.SAFARI_DIR }}
        env:
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Voucherboard.xcodeproj -scheme Voucherboard -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Voucherboard.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $VB_KEYCHAIN --timestamp" CURRENT_PROJECT_VERSION="$BUILD" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '(error|warning:|ARCHIVE)' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"

      - name: Export with Developer ID
        run: |
          set -euo pipefail
          opts="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$opts" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          PLIST
          plutil -lint "$opts"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Voucherboard.xcarchive" \
            -exportOptionsPlist "$opts" -exportPath "$RUNNER_TEMP/export"

      - name: Check the signature
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Voucherboard for Safari.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for b in "$app" "$app/Contents/PlugIns/Voucherboard Extension.appex"; do
            info=$(codesign -dvv "$b" 2>&1)
            echo "$info" | grep -q "Authority=Developer ID Application: .*($APPLE_TEAM_ID)" \
              || { echo "::error::$b isn't signed with the Developer ID Application certificate"; exit 1; }
            echo "$info" | grep -Eq 'flags=.*runtime' || { echo "::error::$b has no hardened runtime"; exit 1; }
            echo "$info" | grep -q 'Timestamp=' || { echo "::error::$b has no secure timestamp"; exit 1; }
            codesign -d --entitlements - --xml "$b" > "$RUNNER_TEMP/ent.plist" 2>/dev/null
            if [ "$(plutil -extract get-task-allow raw "$RUNNER_TEMP/ent.plist" 2>/dev/null || echo false)" = "true" ]; then
              echo "::error::$b is signed for debugging"; exit 1
            fi
          done

      - name: Notarise and staple
        env:
          ZIP: ${{ steps.ver.outputs.zip }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Voucherboard for Safari.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --key "$VB_ASC_KEY" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json" 2>/dev/null || echo unknown)
          if [ "$status" != "Accepted" ]; then
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$VB_ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::Notarisation status: $status"; exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/out/$ZIP"
          shasum -a 256 "$RUNNER_TEMP/out/$ZIP" | tee "$RUNNER_TEMP/out/$ZIP.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.ver.outputs.zip }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/out/$ZIP" "$RUNNER_TEMP/out/$ZIP.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        env:
          ZIP: ${{ steps.ver.outputs.zip }}
        run: |
          {
            echo "### Attached $ZIP to $TAG"
            echo
            echo "Signed with Developer ID, notarised and stapled. Nothing went to the Mac App Store."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${VB_KEYCHAIN:-}" ]; then security delete-keychain "$VB_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/Voucherboard.xcarchive" "$RUNNER_TEMP/export" "$RUNNER_TEMP/notarise.zip"
