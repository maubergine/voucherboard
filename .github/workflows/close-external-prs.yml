name: Close external pull requests

# This repo doesn't accept pull requests (see CONTRIBUTING.md). This workflow closes any PR
# not opened by the owner, with a comment pointing to Issues instead.
#
# pull_request_target runs with the base repo's token and permissions even for fork PRs, which
# is exactly why it must never check out or execute the PR's code: only github-script, and only
# to read metadata (author, PR number) and call the comment/close APIs.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

concurrency:
  group: close-external-prs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    # Dependabot's update PRs are kept; everyone else's are closed.
    if: github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: "Thanks for the interest, but this repository doesn't accept pull requests. Please open an [issue](https://github.com/" + owner + "/" + repo + "/issues) instead if you've found a bug or have a feature request.",
            });
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: issue_number,
              state: "closed",
            });
