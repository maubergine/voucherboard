name: Set up Xcode and XcodeGen
description: Selects Xcode 27 or later and installs the pinned XcodeGen. Used by ios.yml, safari.yml, ios-testflight.yml and safari-release.yml.

runs:
  using: composite
  steps:
    # On a GitHub runner: the newest release Xcode, with xcode-select (App Store uploads need a current SDK).
    # Under act on a Mac (ci/local.sh): DEVELOPER_DIR only, so the Mac's own xcode-select setting is left alone.
    - name: Select Xcode
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${ACT:-}" ]; then
          x="${VB_XCODE:-/Applications/Xcode.app}"
          [ -d "$x/Contents/Developer" ] || { echo "::error::No Xcode at $x. Set VB_XCODE."; exit 1; }
          echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$x/Contents/Developer"
          major=$(xcodebuild -version | sed -nE 's/^Xcode ([0-9]+).*/\1/p')
        else
          x=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.candidate' | sort -V | tail -n1)
          major=$(basename "$x" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')
          [ "$major" -ge 27 ] && sudo xcode-select -s "$x/Contents/Developer"
        fi
        if [ "$major" -lt 27 ]; then echo "::error::Need Xcode 27 or later, found $x"; exit 1; fi
        xcodebuild -version

    - name: Install XcodeGen (pinned, checksum verified)
      shell: bash
      env:
        XCODEGEN_VERSION: "2.46.0"
        XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        rm -rf xcodegen xcodegen.zip
        curl -sSLf -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
        echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
        unzip -q xcodegen.zip
        echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
