<script type="text/javascript">
    $(function () {

        $.select2();

        function loadCarParkPartial() {
            var permitId = $('#PermitId').val();
            $permitDetails.getCarParkPartial(permitId);
        }

        loadCarParkPartial();

        $.removeWrongSymbolsFromVrnFields();

        $('#SelectedDateType[value="SelectFutureDate"]').attr("id", "SelectFutureDate");

        $('#visitorPermit').removeData('validator');
        $('#visitorPermit').removeData('unobtrusiveValidation');
        $.validator.unobtrusive.parse('#visitorPermit');

        $('#FavoriteVehiclesDropDown').hide();
        $('#FavoriteVehicleNicknameContainer').hide();

        $('#SaveVrnAsFavoriteVehicle').click(function () {
            if ($(this).is(':checked')) {
                $('#FavoriteVehicleNicknameContainer').show();
            }

            if ($(this).is(':unchecked')) {
                $('#FavoriteVehicleNicknameContainer').hide();
                $('#FavoriteVehicleNickname').val('');
                $("#NicknameVrnErrorMessage").html("");
            }
        });

        $('#SelectFutureDate[value="SelectFutureDate"]').prop('checked', true);

        $("#checkbox-selected-activate-now, #checkbox-selected-future-date").click(function () {
            $permitDetails.visitorPermitDateTime();
            loadCarParkPartial();
        });

        $("input[id='SelectedDateType']").change(function () {
            $("#IncorrectDateTime").html("");
        });
    })
</script>
