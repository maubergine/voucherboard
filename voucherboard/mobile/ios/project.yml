# XcodeGen spec for the Voucherboard iOS shell. Generate with `xcodegen` in this folder (see README.md).
name: Voucherboard
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple team id (Xcode > Settings > Accounts), or pick the team in Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The one place the ids live: reverse DNS of mariusrubin.com, the owner's domain. Extensions' ids must start with
    # the app's. The app and the share extension need the App Group (Signing & Capabilities); Swift reads it from
    # Info.plist (VBAppGroup). A bundle id can't change once the app is on the App Store.
    APP_BUNDLE_ID: com.mariusrubin.voucherboard
    APP_GROUP_ID: group.com.mariusrubin.voucherboard
targets:
  Voucherboard:
    type: application
    platform: iOS
    sources:
      - path: Voucherboard
      - path: Shared
    dependencies:
      - target: VoucherboardShare # embedded in PlugIns
      - target: VoucherboardLive
    entitlements:
      path: Voucherboard/Voucherboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        # The copy script below writes into the app bundle, which the script sandbox doesn't allow.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The extension's icon, redrawn at 1024 px (Assets.xcassets/AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    preBuildScripts:
      - name: Copy web UI and council scripts
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          MOBILE="$PROJECT_DIR/.."
          SRC="$PROJECT_DIR/../../src"
          rm -rf "$DEST/www" "$DEST/council"
          mkdir -p "$DEST/www/core" "$DEST/council"
          cp -R "$MOBILE/www/." "$DEST/www/"
          for f in zones planner portal terms model reminders plates; do
            [ -f "$SRC/$f.js" ] || { echo "error: missing src/$f.js"; exit 1; }
            cp "$SRC/$f.js" "$DEST/www/core/"
          done
          cp "$SRC/buyfill.js" "$MOBILE/council/council.js" "$DEST/council/"
          [ -f "$DEST/www/engine.html" ] || { echo "error: missing mobile/www/engine.html"; exit 1; }
    info:
      path: Voucherboard/Info.plist
      properties:
        CFBundleDisplayName: Voucherboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        VBAppGroup: $(APP_GROUP_ID)
        NSCameraUsageDescription: Voucherboard reads number plates with the camera. The picture stays on your phone.
        # voucherboard://scan (from the share extension) and voucherboard://visit and extend (from the Live Activity)
        # are handled (SceneDelegate); anything else is ignored.
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - voucherboard
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  VoucherboardShare:
    # Share extension: reads the text in one shared picture and leaves it for the app (mobile/BRIDGE.md).
    type: app-extension
    platform: iOS
    sources:
      - path: VoucherboardShare
      - path: Shared/PlateText.swift
      - path: Shared/SharedScan.swift
    entitlements:
      path: VoucherboardShare/VoucherboardShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: VoucherboardShare/Info.plist
      properties:
        CFBundleDisplayName: Voucherboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VBAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # No storyboard.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
  VoucherboardLive:
    # Widget extension: draws the Live Activity for a visitor parked now (Shared/VisitActivity.swift). No widgets.
    type: app-extension
    platform: iOS
    sources:
      - path: VoucherboardLive
      - path: Shared/VisitActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).live
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: VoucherboardLive/Info.plist
      properties:
        CFBundleDisplayName: Voucherboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
